name: Generate ShortLink Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Python generator
        run: python create_shortlink.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate EF migration
        working-directory: ShortLink
        run: |
          dotnet restore
          dotnet ef migrations add InitialCreate \
            --project src/ShortLink.Api \
            --startup-project src/ShortLink.Api \
            --output-dir Data/Migrations

      - name: Build
        working-directory: ShortLink
        run: dotnet build -c Release --no-restore

      - name: Test
        working-directory: ShortLink
        run: dotnet test -c Release --no-restore

      - name: Create ZIP
        run: |
          rm -f ShortLink.zip

          cd ShortLink

          zip -r ../ShortLink.zip . \
            -x "**/bin/*" \
            -x "**/obj/*"

          cd ..

      - name: Copy generated project into repository
        run: |
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name "ShortLink" \
            ! -name "ShortLink.zip" \
            -exec rm -rf {} +

          cp -R ShortLink/. .

          rm -rf ShortLink

          rm -f create_shortlink.py

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Generate ShortLink project"
            git push
          fi

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ShortLink
          path: ShortLink.zip
