name: Generate ShortLink Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Python generator
        run: python create_shortlink.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        working-directory: ShortLink
        run: dotnet restore ShortLink.sln

      - name: Generate EF migration
        working-directory: ShortLink
        run: |
          dotnet ef migrations add InitialCreate \
            --project src/ShortLink.Api \
            --startup-project src/ShortLink.Api \
            --output-dir Data/Migrations

      - name: Build
        working-directory: ShortLink
        run: dotnet build ShortLink.sln -c Release --no-restore

      - name: Test
        working-directory: ShortLink
        run: dotnet test ShortLink.sln -c Release --no-build --no-restore

      - name: Replace repository with generated project
        run: |
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name "ShortLink" \
            -exec rm -rf {} +

          cp -R ShortLink/. .
          rm -rf ShortLink

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Generate ShortLink project"
            git push
          fi
